# cargo-deny policy for the shipped Rust graph (ARCHITECTURE section 12, ADR-015).
# Dev-dependencies are excluded; test-only oracles never appear in this graph.
# Run: cargo deny check licenses bans sources   (advisories run nightly and in CI as advisory-only)

[graph]
exclude-dev = true
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "FTL",
    "IJG",
    "libpng-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Apache-2.0 WITH LLVM-exception",
]
# OFL-1.1 is allowed for font files only, never for crates.

[bans]
multiple-versions = "warn"
# Workspace crates are not yet publish = false, so path deps look like wildcards; revisit then.
wildcards = "warn"
allow-wildcard-paths = true
deny = [
    # TLS and crypto stacks: qpdf and Rust code use native/RustCrypto/rustls only (ADR-021).
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "openssl-src" },
    { crate = "native-tls" },
    { crate = "gnutls-sys" },
    { crate = "gnutls" },
    { crate = "boring" },
    { crate = "boring-sys" },
    # PDF engines and codecs that are copyleft or banned by name (ARCHITECTURE section 12).
    { crate = "mupdf" },
    { crate = "mupdf-sys" },
    { crate = "poppler" },
    { crate = "poppler-rs" },
    { crate = "poppler-sys" },
    { crate = "ghostscript" },
    { crate = "gs-sys" },
    { crate = "jbig2dec" },
    { crate = "jbig2dec-sys" },
    { crate = "dssim" },
    { crate = "dssim-core" },
    { crate = "libheif-sys" },
    { crate = "libheif-rs" },
]

[advisories]
version = 2
yanked = "deny"
# Only unmaintained crates we depend on directly fail the gate; transitive ones (for example the
# Tauri/GTK3 stack on Linux) are reported but do not block.
unmaintained = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
