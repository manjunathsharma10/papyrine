[package]
name = "papyrine-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Papyrine engine role: document actors, command execution, snapshots and saves"

[dependencies]
papyrine-core = { path = "../papyrine-core" }
papyrine-cos = { path = "../papyrine-cos" }
papyrine-model = { path = "../papyrine-model" }
papyrine-ops = { path = "../papyrine-ops" }
papyrine-writer = { path = "../papyrine-writer" }
papyrine-ipc = { path = "../papyrine-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
