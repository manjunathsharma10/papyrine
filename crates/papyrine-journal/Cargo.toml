[package]
name = "papyrine-journal"
description = "Host-side write-ahead journal and crash recovery for Papyrine (ADR-012)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
crc32c = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
crc32c = "0.6"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
