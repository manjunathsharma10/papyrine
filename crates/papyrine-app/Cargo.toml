[package]
name = "papyrine-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Papyrine single multi-role executable logic: role dispatch, child spawn, supervisor, CLI"

[[bin]]
name = "papyrine-app"
path = "src/main.rs"

[dependencies]
papyrine-core = { path = "../papyrine-core" }
papyrine-cos = { path = "../papyrine-cos" }
papyrine-model = { path = "../papyrine-model" }
papyrine-engine = { path = "../papyrine-engine" }
papyrine-ipc = { path = "../papyrine-ipc" }
papyrine-sandbox = { path = "../papyrine-sandbox" }
papyrine-writer = { path = "../papyrine-writer" }
papyrine-journal = { path = "../papyrine-journal" }
papyrine-render = { path = "../papyrine-render" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
papyrine-engine = { path = "../papyrine-engine", features = ["test-commands"] }
tempfile = "3"

[lints]
workspace = true
