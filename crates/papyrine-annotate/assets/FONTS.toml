#                 U+2713,U+2717'
# Coverage: Basic Latin, Latin-1, Latin Extended-A/B, IPA-adjacent combining marks, Greek,
# Cyrillic, Latin Extended Additional (Vietnamese), general punctuation, currency, a few symbols.
# OS/2 fsType of the upstream fonts is 0 (installable embedding); subsets are embedded in PDFs.

