[package]
name = "papyrine-annotate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Annotation commands (markup, notes, text boxes, ink, shapes, lines, replies) with spec-conformant appearance streams"

[dependencies]
papyrine-core = { path = "../papyrine-core" }
papyrine-cos = { path = "../papyrine-cos" }
papyrine-content = { path = "../papyrine-content" }
papyrine-ops = { path = "../papyrine-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustybuzz = "0.20"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }
subsetter = "0.2"
unicode-bidi = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
papyrine-model = { path = "../papyrine-model" }
papyrine-render = { path = "../papyrine-render" }
papyrine-writer = { path = "../papyrine-writer" }
tempfile = "3"

[lints]
workspace = true
