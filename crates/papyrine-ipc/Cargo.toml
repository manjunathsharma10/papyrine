[package]
name = "papyrine-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Versioned host/engine/renderer IPC protocol, transport and TypeScript bindings"

[dependencies]
papyrine-core = { path = "../papyrine-core" }
papyrine-sandbox = { path = "../papyrine-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
thiserror = "2"
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }

[lints]
workspace = true
