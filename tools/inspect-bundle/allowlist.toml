# System-library allowlist and banned names for tools/inspect-bundle.
# Patterns are case-insensitive globs with `*`. Libraries shipped from third_party/native.toml
# (`provides`) are allowed automatically.

# Banned anywhere: file names inside the artifact and linked library names (ARCHITECTURE section 12).
banned = [
  "libpoppler*", "*poppler*", "libmupdf*", "*mupdf*", "libgs.*", "libgs-*", "libgs_*", "libgsl*",
  "gsdll*", "*ghostscript*", "libjbig2dec*", "*jbig2dec*", "libheif*", "libgnutls*", "*gnutls*",
  "libssl*", "libcrypto*", "ssleay32*", "libeay32*", "libnettle*", "libhogweed*",
]
# Symbol prefixes that reveal static linking of GnuTLS/OpenSSL (a leading '_' is ignored).
banned_symbol_prefixes = ["gnutls_", "SSL_", "EVP_"]

# Bundled libraries built from this repository.
first_party = ["libpapyrine*", "papyrine*"]

# Installer scaffolding (NSIS plug-ins unpacked from the setup .exe), not part of the installed app.
# Still checked for banned names and symbols, but exempt from the "listed library" rule.
installer_internal = ["$PLUGINSDIR/*"]

# Banned-name waivers (empty by default). Add a pattern only together with an ADR.
banned_waivers = []

[macos]
system_prefixes = ["/usr/lib/", "/System/Library/"]

[linux]
# Libraries expected from the distribution (deb/rpm/Flatpak) or the AppImage's WebKitGTK stack.
system = [
  "ld-linux*", "ld64.so*", "linux-vdso*", "libc.so*", "libm.so*", "libdl.so*", "libpthread.so*",
  "librt.so*", "libutil.so*", "libresolv.so*", "libgcc_s.so*", "libstdc++.so*", "libz.so*",
  "libwebkit2gtk-4.1.so*", "libjavascriptcoregtk-4.1.so*", "libsoup-3.0.so*",
  "libgtk-3.so*", "libgdk-3.so*", "libgdk_pixbuf-2.0.so*", "libgio-2.0.so*", "libglib-2.0.so*",
  "libgobject-2.0.so*", "libgmodule-2.0.so*", "libcairo*.so*", "libpango*.so*", "libatk-1.0.so*",
  "libatk-bridge-2.0.so*", "libharfbuzz*.so*", "libfontconfig.so*", "libfreetype.so*",
  "libX11*.so*", "libxcb*.so*", "libxkbcommon*.so*", "libwayland-*.so*", "libdbus-1.so*",
  "libayatana-appindicator3.so*", "libappindicator3.so*", "libxdo.so*", "libEGL.so*", "libGL.so*",
  "libGLESv2.so*", "libgmp.so*",
]

