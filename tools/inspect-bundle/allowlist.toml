  "setupapi.dll", "cfgmgr32.dll", "propsys.dll", "combase.dll", "rpcrt4.dll", "dbghelp.dll",
  "netapi32.dll", "d3d11.dll", "dxgi.dll", "dcomp.dll", "d3dcompiler_47.dll", "msvcrt.dll",
  "ucrtbase.dll", "vcruntime140*.dll", "msvcp140*.dll", "concrt140.dll", "wintrust.dll",
