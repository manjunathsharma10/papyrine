name: nightly

# Fuzzing (1 h per target), the full corpus test run, and blocking advisory checks.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        default: "3600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  discover:
    name: discover fuzz targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        run: |
          # A fuzz project is any dir with a Cargo.toml under fuzz/*/ or crates/*/fuzz/; its
          # targets are the [[bin]] entries.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, tomllib
          items = []
          for toml in sorted(glob.glob("fuzz/*/Cargo.toml") + glob.glob("crates/*/fuzz/Cargo.toml")):
              d = toml.rsplit("/", 1)[0]
              with open(toml, "rb") as f:
                  for b in tomllib.load(f).get("bin", []):
                      items.append({"dir": d, "target": b["name"]})
          print("any=" + ("true" if items else "false"))
          print("matrix=" + json.dumps({"include": items}))
          PY

  fuzz:
    name: fuzz ${{ matrix.dir }} ${{ matrix.target }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/corpus
          key: fuzz-corpus-${{ matrix.dir }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.dir }}-${{ matrix.target }}-
      - name: Fetch native sources
        run: '[ -f third_party/fetch ] && python3 third_party/fetch || true'
      - name: Fuzz
        run: cargo +nightly fuzz run --fuzz-dir ${{ matrix.dir }} ${{ matrix.target }} -- -max_total_time=${{ inputs.fuzz_seconds || '3600' }} -rss_limit_mb=4096
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/

  corpus:
    name: full corpus tests (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf cmake ninja-build
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-corpus
      - uses: actions/cache@v4
        with:
          path: |
            third_party/cache
            corpus/cache
          key: nightly-corpus-${{ hashFiles('third_party/native.toml', 'corpus/manifest.toml', 'corpus/*.toml') }}
          restore-keys: nightly-corpus-
      - name: Fetch native sources, PDFium and the corpus
        run: |
          [ -f third_party/fetch ] && python3 third_party/fetch || true
          [ -f tools/fetch-pdfium ] && python3 tools/fetch-pdfium --platform linux-x64 || true
          [ -f corpus/fetch ] && python3 corpus/fetch || true
      - name: Full corpus test run
        env:
          PAPYRINE_CORPUS: full
        run: cargo test --workspace --release -- --include-ignored

  audit:
    name: advisories (blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check advisories
      - run: cargo audit
      - uses: pnpm/action-setup@v4
        if: hashFiles('apps/desktop/package.json') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('apps/desktop/package.json') != ''
        with:
          node-version: 24
      - name: pnpm audit (production dependencies)
        if: hashFiles('apps/desktop/package.json') != ''
        run: pnpm audit --prod --audit-level high
