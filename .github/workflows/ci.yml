name: CI

# ARCHITECTURE section 10. Checks (fmt, clippy, tests) on the five-platform matrix, the
# licence/notice/corpus/budget gates, and bundle inspection. Steps that depend on parts of
# the repo that may not exist yet (apps/desktop, fetch scripts, qpdf build) skip themselves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One running and at most one waiting run per branch: a backlog of per-commit runs would
  # starve the macOS runners. Running jobs are never cancelled on main.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  detect:
    name: detect optional parts
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.d.outputs.desktop }}
      tauri: ${{ steps.d.outputs.tauri }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -f apps/desktop/package.json ] && echo desktop=true >> "$GITHUB_OUTPUT" || echo desktop=false >> "$GITHUB_OUTPUT"
          [ -f apps/desktop/src-tauri/tauri.conf.json ] && echo tauri=true >> "$GITHUB_OUTPUT" || echo tauri=false >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, pdfium: mac-arm64 }
          - { name: macos-x64, os: macos-15-intel, pdfium: mac-x64 }
          - { name: windows-x64, os: windows-latest, pdfium: win-x64 }
          - { name: windows-arm64, os: windows-11-arm, pdfium: win-arm64 }
          - { name: linux-x64, os: ubuntu-24.04, pdfium: linux-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf cmake ninja-build
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Native sources and test corpus cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/cache
            corpus/cache
          key: native-${{ matrix.name }}-${{ hashFiles('third_party/native.toml', 'third_party/fetch', 'tools/fetch-pdfium', 'corpus/manifest.toml') }}
          restore-keys: native-${{ matrix.name }}-
      - name: Fetch pinned native sources
        run: |
          if [ -f third_party/fetch ]; then python third_party/fetch; else echo "third_party/fetch not present yet"; fi
      - name: Fetch PDFium
        run: |
          if [ -f tools/fetch-pdfium ]; then python tools/fetch-pdfium --platform ${{ matrix.pdfium }}; else echo "tools/fetch-pdfium not present yet"; fi
      # The native stack goes first so a lint in some other crate cannot hide a build or link
      # failure of qpdf/PDFium on a platform. Corpus acceptance tests run in the full pass below.
      - name: native stack (qpdf-sys, papyrine-cos) build and tests
        run: cargo test --locked -p qpdf-sys -p papyrine-cos --lib --tests -- --skip corpus_
      - name: clippy (-D warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace
      - name: qpdf crypto configuration gate
        run: |
          flag=""
          if ls -d third_party/cache/src/qpdf-* >/dev/null 2>&1 && [ -f crates/qpdf-sys/build.rs ]; then flag="--require"; fi
          cargo run --locked -q -p license-gate -- qpdf --build-dir target $flag

  gates:
    name: gates (licenses, notices, corpus, selftest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: pnpm/action-setup@v4
        if: hashFiles('apps/desktop/package.json') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('apps/desktop/package.json') != ''
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS dependencies
        if: hashFiles('apps/desktop/package.json') != ''
        run: pnpm install --frozen-lockfile
      - name: Native sources cache
        uses: actions/cache@v4
        with:
          path: third_party/cache
          key: native-gates-${{ hashFiles('third_party/native.toml', 'third_party/fetch', 'tools/fetch-pdfium') }}
          restore-keys: native-gates-
      - name: Fetch native sources and PDFium licences
        run: |
          [ -f third_party/fetch ] && python third_party/fetch || echo "third_party/fetch not present yet"
          [ -f tools/fetch-pdfium ] && python tools/fetch-pdfium --platform linux-x64 || echo "tools/fetch-pdfium not present yet"
      - name: Lockfile is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build gate tools
        run: cargo build --locked -q -p license-gate -p gen-notices -p inspect-bundle -p check-budgets -p gates-selftest
      - name: Gate - shipped Rust licences and bans (cargo-deny)
        run: cargo deny check licenses bans sources
      - name: Gate - advisories (informational here, blocking nightly)
        continue-on-error: true
        run: cargo deny check advisories
      - name: Gate - shipped JS and native manifest
        run: |
          target/debug/license-gate js
          target/debug/license-gate native --require-fetched
      - name: Gate - notices are fresh
        run: target/debug/gen-notices --check
      - name: Gate - no corpus, keys or blobs in the repo
        run: |
          if [ -f tools/check-no-corpus ]; then python tools/check-no-corpus; else echo "tools/check-no-corpus not present yet"; fi
      - name: Gate self-test (deliberate violations must fail)
        run: |
          # The no-corpus fixtures need tools/check-no-corpus; once it exists nothing may be skipped.
          flag=""; [ -f tools/check-no-corpus ] && flag="--require-all"
          target/debug/gates-selftest $flag

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    needs: [detect]
    if: needs.detect.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, format, unit tests, build
        run: |
          for s in typecheck lint format:check test build; do
            pnpm --filter papyrine-desktop run --if-present "$s"
          done
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend
      - name: Initial JS bundle budget
        run: cargo run --locked -q -p check-budgets -- --platform linux --js-dist apps/desktop/dist

  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: needs.detect.outputs.tauri == 'true'
    needs: [detect]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, platform: macos, pdfium: mac-arm64, bundles: "dmg", bin: "target/release/papyrine" }
          - { name: macos-x64, os: macos-15-intel, platform: macos, pdfium: mac-x64, bundles: "dmg", bin: "target/release/papyrine" }
          - { name: windows-x64, os: windows-latest, platform: windows, pdfium: win-x64, bundles: "msi,nsis", bin: "target/release/papyrine.exe" }
          - { name: windows-arm64, os: windows-11-arm, platform: windows, pdfium: win-arm64, bundles: "msi,nsis", bin: "target/release/papyrine.exe" }
          - { name: linux-x64, os: ubuntu-24.04, platform: linux, pdfium: linux-x64, bundles: "deb,rpm", bin: "target/release/papyrine" }
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf rpm cmake ninja-build xvfb dbus-x11
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native sources cache
        uses: actions/cache@v4
        with:
          path: third_party/cache
          key: native-${{ matrix.name }}-${{ hashFiles('third_party/native.toml', 'third_party/fetch', 'tools/fetch-pdfium') }}
          restore-keys: native-${{ matrix.name }}-
      - name: Fetch native sources
        run: |
          [ -f third_party/fetch ] && python third_party/fetch || true
          [ -f tools/fetch-pdfium ] && python tools/fetch-pdfium --platform ${{ matrix.pdfium }} || true
      - name: Build gate tools
        run: cargo build --locked -q -p inspect-bundle -p check-budgets
      - name: Build installers
        run: pnpm --filter papyrine-desktop tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          find target/release/bundle apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -l out
          [ -n "$(ls -A out)" ] || { echo "::error::no installers were produced"; exit 1; }
      - name: Gate - bundle inspection
        run: |
          for f in out/*; do
            target/debug/inspect-bundle "$f"
          done
      # Launch time and idle memory of the release binary on the runner (ARCHITECTURE 1.1/1.2).
      # measure-shell.mjs drives the app (PAPYRINE_TRACE first-tile stamp) and writes measure.json;
      # the two small files below are the inputs check-budgets expects. Linux runs under Xvfb with
      # a session bus and gates the app's own memory (anon + private dirty, ADR-026).
      - name: Measure launch and idle memory
        env:
          MEASURE_DEBUG: "1"
          REQUIRE_MEASURE: "0"
        run: |
          run=(node apps/desktop/scripts/measure-shell.mjs --bin "${{ matrix.bin }}" --dist apps/desktop/dist \
            --runs 5 --idle-runs 2 --idle-secs 10 --json measure.json)
          if [ "${{ matrix.platform }}" = linux ]; then
            run=(dbus-run-session -- xvfb-run -a "${run[@]}")
          fi
          # The measurement needs the UI to report its first paint (PAPYRINE_TRACE stamp). While the
          # shell does not, this is a visible warning and the launch/memory gates are skipped; it
          # turns into a hard failure as soon as REQUIRE_MEASURE is "1" (set it when the host ships
          # the stamp).
          if "${run[@]}" | tee -a "$GITHUB_STEP_SUMMARY"; then
            node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync("measure.json", "utf8"));
              if (!r.launch || !r.memoryGate) { console.error("measure.json lacks launch/memoryGate"); process.exit(1); }
              fs.writeFileSync("launch.json", JSON.stringify({ cold_ms: r.launch.firstMs, warm_ms: r.launch.medianWarmMs ?? r.launch.medianMs }));
              const g = r.memoryGate;
              fs.writeFileSync("memory.json", JSON.stringify(r.platform === "linux" ? { idle_anon_mb: g.idle_anon_mb, idle_pss_mb: g.idle_pss_mb } : { idle_mb: g.idle_mb }));
            '
            cat launch.json memory.json
          else
            echo "::warning::launch/idle-memory not measured: the app reported no first paint"
            echo "- launch and idle memory NOT measured (the app reported no first paint)" >> "$GITHUB_STEP_SUMMARY"
            [ "${REQUIRE_MEASURE:-0}" != 1 ] || exit 1
          fi
      - name: Fetch main baseline sizes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          id=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] && gh run download "$id" -n "sizes-${{ matrix.name }}" -D baseline || echo "no baseline yet"
      - name: Gate - budgets (installer size, 5% growth, JS bundle)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          args=(--platform ${{ matrix.platform }} --js-dist apps/desktop/dist --write-sizes sizes.json)
          [ -f launch.json ] && args+=(--launch launch.json)
          [ -f memory.json ] && args+=(--memory memory.json)
          for f in out/*; do
            args+=(--installer "$f")
          done
          [ -f baseline/sizes.json ] && args+=(--baseline baseline/sizes.json)
          target/debug/check-budgets "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sizes-${{ matrix.name }}
          path: |
            sizes.json
            measure.json
            launch.json
            memory.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: installers-${{ matrix.name }}
          path: out/
          retention-days: 7

  # ADR-027: Flatpak is the Linux sandboxed-distribution format (AppImage dropped, ADR-026).
  # The runtime (org.gnome.Platform) is not part of the app bundle, so the 50 MB installer
  # budget applies to the app bundle. The manifest packages the prebuilt release binary; a
  # from-source Flathub manifest (offline cargo/pnpm sources) is a v0.2 follow-up.
  flatpak:
    name: bundle (linux-flatpak)
    runs-on: ubuntu-24.04
    needs: [detect]
    if: needs.detect.outputs.tauri == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf cmake ninja-build \
            flatpak flatpak-builder
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: flatpak
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native sources cache
        uses: actions/cache@v4
        with:
          path: third_party/cache
          key: native-linux-x64-${{ hashFiles('third_party/native.toml', 'third_party/fetch', 'tools/fetch-pdfium') }}
          restore-keys: native-linux-x64-
      - name: Fetch native sources
        run: |
          [ -f third_party/fetch ] && python third_party/fetch || true
          [ -f tools/fetch-pdfium ] && python tools/fetch-pdfium --platform linux-x64 || true
      - name: Build the release binary
        run: pnpm --filter papyrine-desktop tauri build --no-bundle -- --locked
      - name: Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=flatpak-repo \
            flatpak-build apps/desktop/flatpak/io.github.manjunathsharma10.papyrine.yml
          mkdir -p out
          flatpak build-bundle flatpak-repo out/papyrine-x86_64.flatpak io.github.manjunathsharma10.papyrine
          ls -l out
      - name: Gate - Flatpak size (50 MB installer budget)
        run: |
          cargo build --locked -q -p check-budgets
          target/debug/check-budgets --platform linux --installer out/papyrine-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: installers-linux-flatpak
          path: out/
          retention-days: 7
